<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DESIRES 1.9+ TierList</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:white;
overflow-x:hidden;
}

.bg-text{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:160px;
color:rgba(255,255,255,0.03);
font-weight:bold;
letter-spacing:20px;
z-index:0;
user-select:none;
}

header{
width:100%;
padding:20px;
background:#0b1020;
border-bottom:2px solid #222;
position:sticky;
top:0;
z-index:100;
}

header h1{
color:#f7c948;
font-size:34px;
text-shadow:0 0 10px gold;
}

.tabs{
display:flex;
gap:15px;
padding:20px;
overflow-x:auto;
white-space:nowrap;
position:relative;
z-index:2;
}

.tab-btn{
background:#10182b;
border:2px solid #1f2a44;
color:white;
padding:16px 22px;
border-radius:16px;
font-size:20px;
cursor:pointer;
transition:0.3s;
min-width:170px;
}

.tab-btn:hover{
background:#17233d;
transform:scale(1.03);
}

.tab-btn.active{
border-color:#f7c948;
box-shadow:0 0 15px rgba(247,201,72,0.5);
}

.content{
padding:20px;
position:relative;
z-index:2;
}

.section{
display:none;
animation:fade 0.4s ease;
}

.section.active{
display:block;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(15px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.player-card{
background:#0e1628;
border:2px solid #1d2a42;
border-radius:20px;
padding:15px;
display:flex;
align-items:center;
justify-content:space-between;
flex-wrap:wrap;
gap:20px;
margin-bottom:20px;
transition:0.3s;
}

.player-card:hover{
transform:scale(1.01);
border-color:#f7c948;
}

.player-left{
display:flex;
align-items:center;
gap:15px;
}

.rank{
font-size:42px;
color:gold;
font-weight:bold;
width:60px;
}

.skin{
width:75px;
height:75px;
border-radius:12px;
border:2px solid white;
background-size:cover;
background-position:center;
}

.player-name{
font-size:28px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

.player-name:hover{
color:gold;
}

.player-title{
color:#f7c948;
margin-top:6px;
font-size:15px;
}

.tiers{
display:flex;
gap:12px;
flex-wrap:wrap;
}

.tier{
background:#121c31;
border:2px solid #2c3d66;
border-radius:14px;
padding:8px 12px;
text-align:center;
min-width:72px;
}

.tier span{
display:block;
font-size:13px;
color:#f7c948;
margin-top:5px;
font-weight:bold;
}

.popup{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%) scale(0);
width:90%;
max-width:650px;
background:#10182b;
border:2px solid gold;
border-radius:20px;
padding:25px;
z-index:1000;
transition:0.3s;
}

.popup.active{
transform:translate(-50%,-50%) scale(1);
}

.popup-flex{
display:flex;
gap:25px;
align-items:flex-start;
flex-wrap:wrap;
}

.popup-skin{
width:150px;
height:150px;
border-radius:18px;
border:3px solid gold;
background-size:cover;
background-position:center;
}

.popup-right{
flex:1;
}

.popup-right h2{
color:gold;
margin-bottom:15px;
}

.popup-right p{
margin:8px 0;
font-size:18px;
}

.close-btn{
margin-top:20px;
width:100%;
padding:12px;
border:none;
background:gold;
color:black;
font-weight:bold;
border-radius:12px;
cursor:pointer;
font-size:17px;
}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.7);
display:none;
z-index:999;
}

.overlay.active{
display:block;
}

.tier-system{
background:#10182b;
border:2px solid gold;
margin:20px;
padding:20px;
border-radius:18px;
position:relative;
z-index:2;
}

.tier-system h2{
color:gold;
margin-bottom:12px;
}

.tier-system p{
line-height:1.8;
color:#ddd;
}

@media(max-width:700px){

.popup-flex{
flex-direction:column;
align-items:center;
}

.popup-right{
width:100%;
}

.bg-text{
font-size:90px;
}

}

</style>
</head>

<body>

<div class="bg-text">DESIRES</div>

<header>
<h1>🔥 DESIRES 1.9+ TierList 🔥</h1>
</header>

<div class="tier-system">
<h2>🏆 Tier Ranking System</h2>

<p>
HT1 > LT1 > HT2 > LT2 > HT3 > LT3 > HT4 > LT4 > HT5 > LT5
</p>

<p>
Hi guys, you are currently on DESIRES official tierlist created by GlowingClaw.
</p>
</div>

<div class="tabs">

<button class="tab-btn active" onclick="showSection('overall',this)">🏆 OverAll</button>

<button class="tab-btn" onclick="showSection('nethpot',this)">⚡ Nethpot</button>

<button class="tab-btn" onclick="showSection('sword',this)">⚔️ Sword</button>

<button class="tab-btn" onclick="showSection('uhc',this)">🕸️ UHC</button>

<button class="tab-btn" onclick="showSection('diapot',this)">🧪 Diapot</button>

<button class="tab-btn" onclick="showSection('cpvp',this)">🔮 Cpvp</button>

<button class="tab-btn" onclick="showSection('mace',this)">🔨 Mace</button>

<button class="tab-btn" onclick="showSection('smp',this)">🟣 SMP</button>

</div>

<div class="content">

<div class="section active" id="overall"></div>
<div class="section" id="nethpot"></div>
<div class="section" id="sword"></div>
<div class="section" id="uhc"></div>
<div class="section" id="diapot"></div>
<div class="section" id="cpvp"></div>
<div class="section" id="mace"></div>
<div class="section" id="smp"></div>

</div>

<div class="overlay" id="overlay" onclick="closePopup()"></div>

<div class="popup" id="popup">

<div class="popup-flex">

<div class="popup-skin" id="popupSkin"></div>

<div class="popup-right">

<h2 id="popupName">Player</h2>

<p><b>⚡ Nethpot:</b> <span id="nether"></span></p>
<p><b>⚔️ Sword:</b> <span id="swordTier"></span></p>
<p><b>🧪 Diapot:</b> <span id="diapotTier"></span></p>
<p><b>🟣 SMP:</b> <span id="smpTier"></span></p>
<p><b>🔨 Mace:</b> <span id="maceTier"></span></p>
<p><b>🔮 Cpvp:</b> <span id="cpvpTier"></span></p>
<p><b>🕸️ UHC:</b> <span id="uhcTier"></span></p>

</div>

</div>

<button class="close-btn" onclick="closePopup()">Close</button>

</div>

<script>

const players = [

{
name:"Icy",
title:"Grandmaster Combat Master",
skin:"https://mc-heads.net/avatar/Icy/100",
nethpot:"LT2",
sword:"N/A",
diapot:"N/A",
smp:"N/A",
mace:"N/A",
cpvp:"N/A",
uhc:"N/A"
},

{
name:"Arsal",
title:"Master Combat Master",
skin:"https://mc-heads.net/avatar/Arsal/100",
nethpot:"HT3",
sword:"LT3",
diapot:"LT3",
smp:"LT3",
mace:"HT4",
cpvp:"LT3",
uhc:"HT4"
},

{
name:"PromoteWlos",
title:"Heroic Master",
skin:"https://mc-heads.net/avatar/PromoteWlos/100",
nethpot:"HT3",
sword:"N/A",
diapot:"N/A",
smp:"N/A",
mace:"N/A",
cpvp:"N/A",
uhc:"N/A"
},

{
name:"Fleric",
title:"Diamond Master",
skin:"https://mc-heads.net/avatar/Fleric/100",
nethpot:"HT3",
sword:"N/A",
diapot:"N/A",
smp:"N/A",
mace:"N/A",
cpvp:"N/A",
uhc:"N/A"
},

{
name:"Haroon",
title:"Platinium Master",
skin:"https://mc-heads.net/avatar/Haroon/100",
nethpot:"LT3",
sword:"LT3",
diapot:"LT3",
smp:"HT4",
mace:"N/A",
cpvp:"HT4",
uhc:"HT4"
},

{
name:"Tavrix",
title:"Ace Player",
skin:"https://mc-heads.net/avatar/Tavrix/100",
nethpot:"LT3",
sword:"LT3",
diapot:"N/A",
smp:"HT4",
mace:"LT4",
cpvp:"HT5",
uhc:"N/A"
},

{
name:"DXTER",
title:"Ace Player",
skin:"https://mc-heads.net/avatar/DXTER/100",
nethpot:"LT3",
sword:"N/A",
diapot:"N/A",
smp:"N/A",
mace:"N/A",
cpvp:"N/A",
uhc:"N/A"
},

{
name:"ReviveMyReflex",
title:"Ace Player",
skin:"https://mc-heads.net/avatar/ReviveMyReflex/100",
nethpot:"RLT3",
sword:"RLT3",
diapot:"RLT3",
smp:"LT4",
mace:"RLT3",
cpvp:"LT3",
uhc:"LT4"
},

{
name:"GlowingClaw",
title:"Ace Player",
skin:"https://mc-heads.net/avatar/GlowingClaw/100",
nethpot:"LT4",
sword:"HT4",
diapot:"LT4",
smp:"N/A",
mace:"LT3",
cpvp:"LT3",
uhc:"N/A"
},

{
name:"PhantomDrugs",
title:"Ace Player",
skin:"https://mc-heads.net/avatar/PhantomDrugs/100",
nethpot:"LT3",
sword:"N/A",
diapot:"N/A",
smp:"N/A",
mace:"N/A",
cpvp:"N/A",
uhc:"HT4"
},

{
name:"Knight",
title:"Ace Player",
skin:"https://mc-heads.net/avatar/Knight/100",
nethpot:"LT3",
sword:"N/A",
diapot:"N/A",
smp:"N/A",
mace:"N/A",
cpvp:"N/A",
uhc:"N/A"
},

{
name:"FieryRay",
title:"Ace Player",
skin:"https://mc-heads.net/avatar/FieryRay/100",
nethpot:"LT3",
sword:"N/A",
diapot:"N/A",
smp:"N/A",
mace:"N/A",
cpvp:"N/A",
uhc:"N/A"
}

];

function createPlayerCard(player,index,mode){

return `

<div class="player-card">

<div class="player-left">

<div class="rank">${index+1}.</div>

<div class="skin"
style="background-image:url('${player.skin}')">
</div>

<div>

<div class="player-name"
onclick="openPlayer(
'${player.name}',
'${player.skin}',
'${player.nethpot}',
'${player.sword}',
'${player.diapot}',
'${player.smp}',
'${player.mace}',
'${player.cpvp}',
'${player.uhc}'
)">
${player.name}
</div>

<div class="player-title">
${player.title}
</div>

</div>

</div>

<div class="tiers">

${mode === "overall" ? `
<div class="tier">⚡<span>${player.nethpot}</span></div>
<div class="tier">⚔️<span>${player.sword}</span></div>
<div class="tier">🧪<span>${player.diapot}</span></div>
<div class="tier">🟣<span>${player.smp}</span></div>
<div class="tier">🔨<span>${player.mace}</span></div>
<div class="tier">🔮<span>${player.cpvp}</span></div>
<div class="tier">🕸️<span>${player.uhc}</span></div>
` : `
<div class="tier"><span>${player[mode]}</span></div>
`}

</div>

</div>

`;

}

document.getElementById("overall").innerHTML =
players.map((p,i)=>createPlayerCard(p,i,"overall")).join("");

const modes = [
"nethpot",
"sword",
"diapot",
"smp",
"mace",
"cpvp",
"uhc"
];

modes.forEach(mode=>{

const filtered = players.filter(p=>p[mode] !== "N/A");

document.getElementById(mode).innerHTML =
filtered.map((p,i)=>createPlayerCard(p,i,mode)).join("");

});

function showSection(id,btn){

document.querySelectorAll('.section').forEach(sec=>{
sec.classList.remove('active');
});

document.querySelectorAll('.tab-btn').forEach(b=>{
b.classList.remove('active');
});

document.getElementById(id).classList.add('active');
btn.classList.add('active');

}

function openPlayer(
name,
skin,
nethpot,
sword,
diapot,
smp,
mace,
cpvp,
uhc
){

document.getElementById('popupName').innerText=name;

document.getElementById('popupSkin').style.backgroundImage=
`url(${skin})`;

document.getElementById('nether').innerText=nethpot;
document.getElementById('swordTier').innerText=sword;
document.getElementById('diapotTier').innerText=diapot;
document.getElementById('smpTier').innerText=smp;
document.getElementById('maceTier').innerText=mace;
document.getElementById('cpvpTier').innerText=cpvp;
document.getElementById('uhcTier').innerText=uhc;

document.getElementById('popup').classList.add('active');
document.getElementById('overlay').classList.add('active');

}

function closePopup(){

document.getElementById('popup').classList.remove('active');
document.getElementById('overlay').classList.remove('active');

}

</script>

</body>
</html>
